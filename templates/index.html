<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Web App</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">
        <div class="card">
            <h1>Python Web App</h1>

            <p class="subtitle">
                Application deployed successfully using Docker and GitHub Actions.
            </p>

            <div class="status">
                <span class="status-dot"></span>
                Application is running
            </div>

            <div class="info">
                <p><strong>Server:</strong> 13.223.91.250</p>
                <p><strong>Port:</strong> 8080</p>
                <p><strong>Deployment:</strong> CI/CD</p>
            </div>

            <button onclick="checkHealth()">
                Check Application
            </button>

            <p id="result"></p>
        </div>
    </div>

    <script>
        async function checkHealth() {
            const result = document.getElementById("result");

            try {
                const response = await fetch("/health");

                if (response.ok) {
                    result.textContent = "✓ Application is healthy";
                    result.className = "success";
                } else {
                    result.textContent = "✗ Application health check failed";
                    result.className = "error";
                }
            } catch (error) {
                result.textContent = "✗ Unable to connect to application";
                result.className = "error";
            }
        }
    </script>

</body>
</html>
