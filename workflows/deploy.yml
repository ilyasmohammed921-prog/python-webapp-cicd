name: Build and Deploy Python App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}


      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/python-webapp:latest .


      # 4. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/python-webapp:latest


      # 5. Setup SSH key
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts


      # 6. Deploy to EC2
      - name: Deploy application to EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            ec2-user@${{ secrets.EC2_HOST }} << 'EOF'

            echo "Starting deployment..."

            echo "Pulling latest Docker image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/python-webapp:latest

            echo "Stopping old container..."
            docker stop python-webapp || true

            echo "Removing old container..."
            docker rm python-webapp || true

            echo "Starting new container..."
            docker run -d \
              --name python-webapp \
              -p 80:5000 \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/python-webapp:latest

            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo "Deployment completed!"

          EOF
