name: CD - Deploy to Kubernetes

on:
  workflow_run:
    workflows:
      - CI - Build and Push Docker Image
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Kubernetes image
        run: |
          sed -i \
            "s|IMAGE_PLACEHOLDER|${{ secrets.DOCKERHUB_USERNAME }}/python-webapp-cicd:latest|g" \
            k8s/deployment.yaml

      - name: Show Kubernetes manifest
        run: |
          cat k8s/deployment.yaml
