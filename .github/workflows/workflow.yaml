name: CI/CD - Docker Hub + Kubernetes

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-push-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}


      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ilyasdevops/python-webapp:${{ github.sha }} \
            -t ilyasdevops/python-webapp:latest .


      # 4. Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ilyasdevops/python-webapp:${{ github.sha }}
          docker push ilyasdevops/python-webapp:latest


      # 5. Configure Killercoda Kubernetes
      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config


      # 6. Test Kubernetes connection
      - name: Check Kubernetes
        run: |
          kubectl cluster-info
          kubectl get nodes


      # 7. Deploy new image
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/python-webapp \
            python-webapp=ilyasdevops/python-webapp:${{ github.sha }}


      # 8. Wait for rollout
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/python-webapp
          kubectl get pods
