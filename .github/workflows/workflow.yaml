```yaml
name: CI/CD - Docker Hub + Kubernetes

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-push-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout GitHub Repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Login to Docker Hub
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}


      # ==========================================
      # 3. Build Docker Image
      # ==========================================
      - name: Build Docker image
        run: |
          docker build \
            -t ilyasdevops/python-webapp:${{ github.sha }} \
            -t ilyasdevops/python-webapp:latest .


      # ==========================================
      # 4. Push Docker Image to Docker Hub
      # ==========================================
      - name: Push Docker image
        run: |
          docker push ilyasdevops/python-webapp:${{ github.sha }}
          docker push ilyasdevops/python-webapp:latest


      # ==========================================
      # 5. Configure Killercoda Kubernetes
      # ==========================================
      - name: Configure Kubernetes
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"

          printf '%s' '${{ secrets.KUBE_CONFIG }}' > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

          echo "Kubernetes configuration created"


      # ==========================================
      # 6. Check Kubernetes Configuration
      # ==========================================
      - name: Check Kubernetes configuration
        shell: bash
        run: |
          kubectl config get-contexts
          kubectl config current-context


      # ==========================================
      # 7. Test Kubernetes Connection
      # ==========================================
      - name: Check Kubernetes connection
        shell: bash
        run: |
          kubectl cluster-info
          kubectl get nodes


      # ==========================================
      # 8. Update Kubernetes Deployment
      # ==========================================
      - name: Deploy application
        shell: bash
        run: |
          kubectl set image deployment/python-webapp \
            python-webapp=ilyasdevops/python-webapp:${{ github.sha }}


      # ==========================================
      # 9. Wait for Rolling Update
      # ==========================================
      - name: Wait for deployment
        shell: bash
        run: |
          kubectl rollout status deployment/python-webapp


      # ==========================================
      # 10. Verify Pods
      # ==========================================
      - name: Verify Kubernetes deployment
        shell: bash
        run: |
          kubectl get deployment python-webapp
          kubectl get pods -o wide
          kubectl get svc
```
