name: CI/CD - Build Push Deploy

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build Docker image
        run: |
          docker build \
            -t ilyasdevops/python-webapp:${{ github.sha }} \
            -t ilyasdevops/python-webapp:latest .


      - name: Push Docker image
        run: |
          docker push ilyasdevops/python-webapp:${{ github.sha }}
          docker push ilyasdevops/python-webapp:latest


      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config


      - name: Test Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes


      - name: Deploy application
        run: |
          kubectl set image deployment/python-webapp \
            python-webapp=ilyasdevops/python-webapp:${{ github.sha }}


      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/python-webapp
