name: CI/CD - Docker Hub + Killercoda Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push-deploy:

    # Run directly on the Killercoda self-hosted runner
    runs-on: self-hosted

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Check runner and Kubernetes
      - name: Check Killercoda environment
        shell: bash
        run: |
          echo "===== RUNNER ====="
          hostname
          whoami

          echo "===== KUBERNETES ====="
          kubectl config current-context
          kubectl get nodes

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}

      # 4. Build Docker image
      - name: Build Docker image
        shell: bash
        run: |
          docker build \
            -t ilyasdevops/python-webapp:${{ github.sha }} \
            -t ilyasdevops/python-webapp:latest .

      # 5. Push Docker image to Docker Hub
      - name: Push Docker image
        shell: bash
        run: |
          docker push ilyasdevops/python-webapp:${{ github.sha }}
          docker push ilyasdevops/python-webapp:latest

      # 6. Verify Kubernetes cluster
      - name: Check Kubernetes cluster
        shell: bash
        run: |
          echo "===== CLUSTER INFO ====="
          kubectl cluster-info

          echo "===== NODES ====="
          kubectl get nodes

      # 7. Check existing deployment
      - name: Check existing deployment
        shell: bash
        run: |
          kubectl get deployment python-webapp
          kubectl get pods -o wide

      # 8. Deploy new Docker image
      - name: Deploy application
        shell: bash
        run: |
          kubectl set image deployment/python-webapp \
            python-webapp=ilyasdevops/python-webapp:${{ github.sha }}

      # 9. Wait for rolling update
      - name: Wait for deployment
        shell: bash
        run: |
          kubectl rollout status deployment/python-webapp \
            --timeout=180s

      # 10. Verify deployment
      - name: Verify deployment
        shell: bash
        run: |
          echo "===== DEPLOYMENT ====="
          kubectl get deployment python-webapp

          echo "===== PODS ====="
          kubectl get pods -o wide

          echo "===== SERVICE ====="
          kubectl get svc python-webapp
