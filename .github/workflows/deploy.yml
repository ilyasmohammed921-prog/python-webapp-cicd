name: Build and Deploy Python App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Code
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Login to Docker Hub
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}


      # ==========================================
      # 3. Build Docker Image
      # ==========================================
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/python-webapp:latest .


      # ==========================================
      # 4. Push Docker Image
      # ==========================================
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/python-webapp:latest


      # ==========================================
      # 5. Setup SSH
      # ==========================================
      - name: Setup SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key.pem

          chmod 600 ~/.ssh/ec2_key.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts


      # ==========================================
      # 6. Deploy to EC2
      # ==========================================
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            ec2-user@"$EC2_HOST" << EOF

            set -e

            IMAGE="$DOCKERHUB_USERNAME/python-webapp:latest"
            CONTAINER="python-webapp"

            echo "=========================================="
            echo "STARTING DEPLOYMENT"
            echo "=========================================="

            echo ""
            echo "Pulling latest Docker image..."
            sudo docker pull "\$IMAGE"

            echo ""
            echo "Stopping old Python application..."
            sudo docker stop "\$CONTAINER" || true

            echo ""
            echo "Removing old Python application..."
            sudo docker rm "\$CONTAINER" || true

            echo ""
            echo "Starting new Python application..."
            sudo docker run -d \
              --name "\$CONTAINER" \
              -p 8080:5000 \
              --restart unless-stopped \
              "\$IMAGE"

            echo ""
            echo "Waiting for application..."
            sleep 5

            echo ""
            echo "Container status:"
            sudo docker ps --filter "name=\$CONTAINER"

            echo ""
            echo "Testing application..."

            curl -f http://localhost:8080/health

            echo ""
            echo ""
            echo "=========================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

            echo ""
            echo "Application URL:"
            echo "http://\$EC2_HOST:8080"

            echo ""
            echo "Cleaning unused Docker images..."
            sudo docker image prune -f

          EOF
