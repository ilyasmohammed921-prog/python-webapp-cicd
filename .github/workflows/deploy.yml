```yaml
name: Build and Deploy Python App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/python-webapp:latest .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/python-webapp:latest

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_key.pem \
            ec2-user@"$EC2_HOST" << EOF

            set -e

            echo "Pulling latest image..."
            docker pull "$DOCKERHUB_USERNAME/python-webapp:latest"

            echo "Stopping old container..."
            docker stop python-webapp || true

            echo "Removing old container..."
            docker rm python-webapp || true

            echo "Starting new container..."
            docker run -d \
              --name python-webapp \
              -p 80:5000 \
              --restart unless-stopped \
              "$DOCKERHUB_USERNAME/python-webapp:latest"

            echo "Deployment completed."

            docker ps

          EOF
```
